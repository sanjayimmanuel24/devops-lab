apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-web-deployment
  labels:
    app: python-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-web
  template:
    metadata:
      labels:
        app: python-web
    spec:
      containers:
        - name: python-web
          # The manual uses dockersamples/flaskapp:latest, but that image no longer exists on Docker Hub.
          # Use your own Flask image from Experiment 2 instead (it also listens on port 5000).
          # run.ps1 replaces YOUR_DOCKERHUB_USERNAME with the value from config.ps1 automatically.
          image: YOUR_DOCKERHUB_USERNAME/flask-docker-app:latest
          ports:
            - containerPort: 5000
